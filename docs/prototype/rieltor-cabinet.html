function score(c,l){
  const cr=c.crit; if(!cr) return null;
  const inv=INV[l.inv];
  if(l.pr==='removed'||l.av==='sold') return {gone:1};
  if(cr.cities.length&&!cr.cities.includes(inv.city)) return {fail:'місто'};
  if((cr.dists||[]).length&&!cr.dists.includes(inv.dist)) return {fail:'район'};
  if(l.price>cr.budget) return {fail:'бюджет'};
  if(cr.rooms.length&&!cr.rooms.includes(l.rooms)) return {fail:'кімнати'};
  if(l.area<cr.minArea) return {fail:'площа'};
  const p=Math.max(0,Math.min(30,Math.round(30*(1.15-l.price/cr.budget)/0.45)));
  const a=l.area>=cr.minArea*1.15?20:12, f=l.floor>=cr.floorMin?15:5, d=ym(l.done)<=cr.by?15:6;
  const fi=(cr.finish==='any'||cr.finish===l.fin)?10:3, x=l.bal?10:4;
  return {total:p+a+f+d+fi+x,parts:[['Ціна',p,30],['Площа',a,20],['Поверх',f,15],['Термін здачі',d,15],['Стан',fi,10],['Балкон / садок',x,10]]};
}

function groupedListings(list){
  const man=list.filter(l=>l.manual), reg=list.filter(l=>!l.manual);
  const groups=Object.keys(DEV).filter(d=>reg.some(l=>INV[l.inv].dev===d)).map(d=>({key:d,dev:d,title:DEV[d].n,ls:reg.filter(l=>INV[l.inv].dev===d)}));
  if(man.length) groups.push({key:'_manual',title:'Додані вручну',ls:man});
  if(!groups.length) return '<div class="card"><p class="muted" style="margin:0">Нічого не знайдено</p></div>';
  const allOpen=groups.every(g=>S.open[g.key]);
  return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="small muted">${groups.length} ${groups.length===1?'група':'груп'} за поточним фільтром. Натисніть на назву, щоб побачити лоти.</span><button class="btn sm" data-a="toggleAll">${allOpen?'Згорнути всі':'Розгорнути всі'}</button></div>`+groups.map(g=>{
    const open=!!S.open[g.key], av=g.ls.filter(l=>!unavailable(l)).length, rs=g.ls.filter(l=>l.av==='reserved').length, invs=[...new Set(g.ls.map(l=>l.inv))];
    const srcs=g.dev?S.sources.filter(s=>invs.includes(s.inv)):[];
    return `<div class="card" style="margin-bottom:10px;padding:0"><div class="row" style="justify-content:space-between;padding:12px 16px;flex-wrap:nowrap">
      <div data-a="toggleDev" data-id="${g.key}" role="button" tabindex="0" style="cursor:pointer;flex:1;min-width:0"><div class="row" style="gap:8px"><span class="mono muted">${open?'▾':'▸'}</span><b style="font-size:15px">${esc(g.title)}</b><span class="pill ok plain">Wolne ${av}</span><span class="pill warn plain">Rezerwacja ${rs}</span></div>
      <div class="small muted" style="margin-left:22px">${g.ls.length} лотів${g.dev?` · ${invs.length} ${invs.length===1?'інвестиція':'інвестицій'}${DEV[g.dev].partner?` · партнер, комісія ${DEV[g.dev].pct}%`:' · без партнерської угоди'}`:' · окремі посилання'}</div></div>
      ${g.dev&&S.role!=='admin'?`<button class="btn sm" data-a="modal" data-id="addSource" data-dev="${g.dev}">+ Інвестиція / посилання</button>`:''}</div>
      ${open?`<div style="padding:0 16px 14px">${srcs.length?`<div class="list small" style="margin-bottom:10px">${srcs.map(s=>`<div class="item"><span><b>${esc(INV[s.inv].n)}</b> <span class="mono muted">${esc(s.url)}</span></span><span class="row" style="flex-wrap:nowrap"><span class="pill ${s.type==='aggregator'?'warn':'ok'} plain">${typeLabel(s)}</span><span class="pill ${fresh(s.last)} plain">${ago(s.last)}</span></span></div>`).join('')}</div>`:''}${lotTable(g.ls)}</div>`:''}</div>`}).join('');
}

function pSource(s){
  const r=S.repair&&S.repair.sid===s.id?S.repair:null, mx=Math.max(...s.runs);
  return `<div class="row" style="margin-bottom:6px"><button class="btn sm" data-a="selSource" data-id="">← Джерела</button></div>`+pageTop(INV[s.inv].n,`<span class="mono">${esc(s.url)}</span>`,`<span class="pill ${s.state==='ok'?'ok':s.state==='paused'?'warn':'bad'}">${{ok:'Працює',paused:'Пауза',needs_review:'Потребує перегляду'}[s.state]}</span><button class="btn" data-a="toast" data-id="Запущено позачерговий прогін (прототип)">Запустити прогін зараз</button>`)+
  `<div class="grid g3" style="margin-bottom:14px"><div class="card"><div class="kpi"><b>${S.listings.filter(l=>l.src===s.id).length}</b><span>лотів у базі</span></div></div><div class="card"><div class="kpi"><b>v${s.v}</b><span>активна версія конфігу</span></div></div><div class="card"><h3>Лотів за останні прогони</h3><div class="spark" style="margin-top:8px">${s.runs.map(n=>`<i style="height:${Math.max(4,n/mx*100)}%" title="${n}"></i>`).join('')}</div></div></div>`+

}

  `<div class="card">${S.importDone?`<div class="note" style="margin-bottom:12px">Останній імпорт: klienci_2025.xlsx · створено 3 клієнти в прототипі (131 у повній версії), 4 конфлікти передано вам, 9 телефонів позначено для ручної перевірки.</div><button class="btn bad" data-a="importRollback">Відкотити імпорт</button>`:`<p class="muted" style="margin:0">Імпортів ще не було. Майстер: файл → відповідність колонок → прев’ю з конфліктами → імпорт.</p>`}</div>
  <div class="grid g3" style="margin-top:14px">${[['Телефони → E.164','Номери без коду країни читаються як польські. Те, що не вдалося розібрати, позначається, без вгадування.'],['Конфлікти','Телефон уже є в клієнта іншого ріелтора: запис не перезаписується, рішення приймає власник.'],['Відкат','Скасовуються лише створені рядки, до яких ще ніхто не торкався.']].map(x=>`<div class="card flat"><h2>${x[0]}</h2><p class="small muted" style="margin:6px 0 0">${x[1]}</p></div>`).join('')}</div>`;
}

/* ============ СТОРІНКА КЛІЄНТА (телефон) ============ */
function shareView(c){
  const ps=propsOf(c.id).filter(p=>p.delivery!=='draft');
  const pl=c.lang==='pl';
  return `<div class="phone"><div class="scr">
   <div><div style="font-size:12px" class="muted">${pl?'Wybrane dla Ciebie':'Підібрано для вас'}</div><div style="font-size:18px;font-weight:600">${esc(c.name.split(' ')[0])}, ${pl?'oto Twoje propozycje':'ось ваші варіанти'}</div></div>
   ${ps.map(p=>{const l=Ls(p.lid),bad=unavailable(l);
    return `<div class="lot"><div style="display:flex;justify-content:space-between;gap:8px"><b>${l.rooms} ${pl?'pok.':'кімн.'} · ${String(l.area).replace('.',',')} m²</b>${bad?`<span class="pill bad">${pl?'niedostępne':'недоступно'}</span>`:'<span class="pill ok">'+(pl?'dostępne':'доступно')+'</span>'}</div>
     <div class="muted small">${INV[l.inv].n} · ${l.floor?l.floor+(pl?' piętro':' поверх'):''} · ${pl?'oddanie':'здача'} ${l.done}</div><div style="font-size:17px;font-weight:600" class="num">${zl(l.price)}</div>
     ${bad?`<div class="small muted">${pl?'Ten lokal został zarezerwowany. Doradca przygotuje zamiennik.':'Цей лот уже зарезервовано. Ріелтор підбере заміну.'}</div>`:
     p.reaction==='wants_viewing'||p.slot?`<div class="small"><b>${p.slot?(pl?'Prezentacja potwierdzona: ':'Показ підтверджено: ')+fmtAt(p.slot):(pl?'Wybierz termin:':'Оберіть час:')}</b></div>${p.slot?'':`<div style="display:flex;gap:6px;flex-wrap:wrap">${SLOTS.map(s=>`<button class="btn sm" data-a="pickSlot" data-id="${p.id}" data-v="${s}">${fmtAt(s)}</button>`).join('')}</div>`}`:
     `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ${p.reaction==='liked'?'on':''}" data-a="react" data-id="${p.id}" data-v="liked">👍 ${pl?'Podoba się':'Подобається'}</button><button class="btn sm ${p.reaction==='disliked'?'on':''}" data-a="react" data-id="${p.id}" data-v="disliked">👎 ${pl?'Nie':'Ні'}</button><button class="btn sm" data-a="react" data-id="${p.id}" data-v="wants_viewing">${pl?'Chcę obejrzeć':'Хочу показ'}</button></div>`}
     ${p.reaction==='disliked'?`<select data-c="reason" data-id="${p.id}" style="font-size:12px"><option>${pl?'Powód (opcjonalnie)':'Причина (необов’язково)'}</option>${['Ціна','Поверх','Площа','Район','Інше'].map(x=>`<option ${p.reason===x?'selected':''}>${x}</option>`).join('')}</select>`:''}</div>`}).join('')}
   <div class="small muted" style="text-align:center">${pl?'Nie pokazujemy kontaktów dewelopera. Pytania kieruj do doradcy.':'Контактів забудовника тут немає. Питання ріелтору.'}</div></div></div>`;
}

function sendModal(m,close){
  const c=C(S.cid), ds=propsOf(c.id).filter(p=>p.delivery==='draft');

  <div class="list">${ds.map(p=>{const l=Ls(p.lid);return `<div class="item"><span>${esc(lotName(l))}</span>${unavailable(l)?'<span class="pill bad">змінився статус, виключено</span>':'<span class="pill ok">актуально · перевірено щойно</span>'}</div>`}).join('')}</div>

function handoverModal(m,close){

  return `<div class="row" style="justify-content:space-between"><h2>Передати клієнтів: ${esc(u.name)}</h2>${close}</div>
  <div class="list small"><div class="item"><span>Клієнтів</span><b>${cl.length}</b></div><div class="item"><span>Відкритих нагадувань</span><b>${S.rems.filter(r=>r.u===u.id&&!r.done).length}</b></div><div class="item"><span>Запланованих показів</span><b>${S.views.filter(v=>v.u===u.id).length}</b></div></div>

  <p class="small muted" style="margin:0">Операція ідемпотентна: якщо збій перерве передачу, її можна продовжити.</p>
  <button class="btn pri" data-a="doHandover" data-u="${u.id}">Передати</button>`;
}

  else if(k==='mlurl'){S.modal.chk=undefined;S.modal.f={inv:$('#ml_i').value,no:$('#ml_n').value,rooms:+$('#ml_r').value||2,area:+$('#ml_a').value||40,price:+$('#ml_p').value||0,url:el.value.trim()}}
  else if(k==='reason'){S.props.find(p=>p.id===id).reason=el.value}
  else if(k==='ncphone'){S.modal.phone=el.value;S.modal.name=$('#nc_name').value}
  render();
});
