<title>Кабінет ріелтора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar (desktop) or bottom tabs (phone) + one working column. Home = one prioritized action queue.
   Color: green-grey ground, ink-teal accent; status colors (ok / warn / bad / info) stay separate from the accent.
   Type: IBM Plex Sans for UI, IBM Plex Mono only for numbers, ids and links. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface2:#EAF0ED; --ink:#13201C; --ink2:#4E5E58; --mute:#5F6D68; --line:#DAE2DE; --line2:#EBF0ED;
  --accent:#0B5D4E; --accent-ink:#FFFFFF; --accent-soft:#D8EDE7; --accent-line:#9CCFC3;
  --ok:#1A7A43; --ok-soft:#DCF0E3; --warn:#8A5600; --warn-soft:#FBEBC8; --bad:#B0372D; --bad-soft:#F8DDD9;
  --info:#2A5C9B; --info-soft:#DDE9F7; --mute-soft:#E6EAE8;
  --shadow:0 1px 2px rgba(19,32,28,.06),0 10px 28px rgba(19,32,28,.10);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --pad:max(16px,env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --surface2:#1E2C28; --ink:#E7EFEC; --ink2:#A0B0AA; --mute:#8FA09A; --line:#2B3A35; --line2:#22302C;
  --accent:#4FC3A5; --accent-ink:#05231B; --accent-soft:#183830; --accent-line:#2C6B5C;
  --ok:#5CCB8A; --ok-soft:#163323; --warn:#E3B152; --warn-soft:#3A2D10; --bad:#F27D70; --bad-soft:#401D1A;
  --info:#82B3EC; --info-soft:#1B2D45; --mute-soft:#233029;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --surface2:#1E2C28; --ink:#E7EFEC; --ink2:#A0B0AA; --mute:#8FA09A; --line:#2B3A35; --line2:#22302C;
  --accent:#4FC3A5; --accent-ink:#05231B; --accent-soft:#183830; --accent-line:#2C6B5C;
  --ok:#5CCB8A; --ok-soft:#163323; --warn:#E3B152; --warn-soft:#3A2D10; --bad:#F27D70; --bad-soft:#401D1A;
  --info:#82B3EC; --info-soft:#1B2D45; --mute-soft:#233029;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600;text-wrap:balance}
h3{font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .small{font-size:12px} .xs{font-size:11px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 8px;font-weight:600;font-size:15px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:13px;flex:none}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);min-height:36px}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .grow{flex:1}
.cnt{font-family:var(--mono);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.cnt.soft{background:var(--warn-soft);color:var(--warn)}
.demo{margin-top:auto;border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.demo summary{cursor:pointer;font-weight:500;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px}
.demo summary::-webkit-details-marker{display:none}
.demo .box{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.demo label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 28px;border-bottom:1px solid transparent}
.bar .brand{display:none;padding:0}
.search{position:relative;flex:1;max-width:520px;min-width:0}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:40px}
.search input[type=search]{padding:9px 12px 9px 38px}
.demo .btn{white-space:normal;text-align:left;justify-content:flex-start;line-height:1.3}
.search .ic{position:absolute;left:11px;top:11px;color:var(--mute);pointer-events:none}
.pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:60vh;overflow:auto}
.pop.r{left:auto;right:0;min-width:230px}
.pop .it{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.pop .it:hover{background:var(--surface2)}
.pop .hd{padding:6px 10px 2px}
.page{padding:8px 28px 56px;max-width:1120px;width:100%;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph p{color:var(--ink2);margin-top:4px;max-width:68ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:14px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card>header,.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card.tight{padding:0}
.card.soft{background:var(--surface2);border-color:transparent}
.sub{border-top:1px solid var(--line2);padding-top:12px;margin-top:12px}
.stats{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats>div{flex:1;padding:12px 16px;min-width:0;border-right:1px solid var(--line2)}
.stats>div:last-child{border-right:0}
.stats b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:12px;color:var(--ink2)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 10px;font-size:12px;min-height:30px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .ic{width:16px;height:16px}
select,input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=search],input[type=tel],textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0;min-height:38px}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);min-height:32px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(19,32,28,.12)}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 11px;cursor:pointer;background:var(--surface);font-size:12px;display:inline-flex;gap:6px;align-items:center;min-height:30px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn.icon{padding:0;width:34px;min-width:34px;min-height:34px;border-radius:9px}
.btn.icon.sm{width:30px;min-width:30px;min-height:30px}
.btn.icon .ic{width:16px;height:16px}
.pick{display:flex;align-items:flex-start;gap:10px}
.pick input{width:18px;height:18px;margin-top:2px}
.score{border:0;background:none;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;border-bottom:1px dotted var(--ink2);padding:0 2px;color:var(--ink)}
.nav button.sec-btn{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:12px 10px 4px;min-height:0;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--mute-soft);color:var(--mute)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.plain::before{display:none}
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--accent)} .sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

/* lists */
.lst{display:flex;flex-direction:column}
.li{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0;padding-bottom:0} .li:first-child{padding-top:0}
.li>div{min-width:0}
.li.click{cursor:pointer}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface2)}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:600}

/* action queue */
.q{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.q:last-child{border-bottom:0}
.q .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--mute-soft);color:var(--mute)}
.q .ico.bad{background:var(--bad-soft);color:var(--bad)} .q .ico.warn{background:var(--warn-soft);color:var(--warn)} .q .ico.info{background:var(--info-soft);color:var(--info)} .q .ico.ok{background:var(--ok-soft);color:var(--ok)}
.q .t{font-weight:500}
.q .acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;align-items:center}
.group-t{padding:12px 16px 6px;display:flex;gap:8px;align-items:center}

/* client list rows */
.cl{display:grid;grid-template-columns:minmax(0,1.3fr) 150px minmax(0,1.5fr) minmax(0,1.3fr);gap:6px 16px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.cl:hover{background:var(--surface2)}
.cl:last-child{border-bottom:0}
.cl.h{cursor:default;padding:9px 16px;background:none}
.cl.h:hover{background:none}

/* stepper */
.steps{display:flex;gap:0;overflow-x:auto;padding:2px 0}
.step{flex:1;min-width:112px;border:0;background:none;padding:6px 6px 0;cursor:default;text-align:left;color:var(--ink2);position:relative}
.step::before{content:"";display:block;height:4px;border-radius:99px;background:var(--line);margin-bottom:8px}
.step.done::before{background:var(--accent-line)} .step.cur::before{background:var(--accent)}
.step.cur{color:var(--ink);font-weight:600}
.step small{display:block;font-weight:400;color:var(--mute);font-size:11px}

/* lot card in match list */
.lot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 150px auto;gap:8px 16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.lot:last-child{border-bottom:0}
.lot .name{font-weight:600;cursor:pointer}
.lot .name:hover{color:var(--accent)}
.bar2{height:6px;border-radius:99px;background:var(--mute-soft);overflow:hidden} .bar2 i{display:block;height:100%;background:var(--accent)}
.parts{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:12px;margin-top:6px}
details>summary{cursor:pointer;color:var(--ink2);font-size:12px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 9px 9px 0;font-size:13px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.info{border-color:var(--info);background:var(--info-soft)}
.alert{border:1px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:12px 14px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.alert.info{border-color:var(--info);background:var(--info-soft)}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.tl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 0}
.tl .dot{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--ink2)}
.tl .dot .ic{width:14px;height:14px}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px;text-align:left}
.how>div{background:var(--surface2);border-radius:12px;padding:12px}
.how b{display:block;margin-bottom:2px}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}.spark i{flex:1;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-width:4px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* modal / sheet */
.ov{position:fixed;inset:0;background:rgba(8,16,14,.55);display:grid;place-items:center;padding:16px;z-index:60;overflow:auto}
.modal{background:var(--surface);border-radius:16px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(900px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;max-width:min(92vw,520px);box-shadow:var(--shadow)}
.phone{width:min(370px,100%);margin:0 auto;border:9px solid #1b2623;border-radius:34px;background:#f6f8f7;color:#14201d;overflow:hidden}
.phone .scr{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:600px;overflow:auto;font-size:14px}
.phone .plot{background:#fff;border:1px solid #d5ddda;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.phone .btn{background:#fff;color:#14201d;border-color:#c5d0cc}.phone .btn.on{background:#0B5D4E;color:#fff;border-color:#0B5D4E}
.phone .m{color:#51605c}
.bnav{display:none}
.mob-only{display:none}
.lot.src{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 170px auto}
.lot.m{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 150px 110px}
.lot.lead{grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) auto}
.lot.lead>.row{justify-content:flex-end}
.mrow{display:flex;gap:10px;align-items:flex-start}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .bar{padding:10px var(--pad);gap:8px}
  .bar .brand{display:flex}
  .bar .brand b{display:none}
  .page{padding:6px var(--pad) 96px}
  .g2,.g3,.g21{grid-template-columns:minmax(0,1fr)} .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mob-only{display:inline-flex}
  .row.nw{flex-wrap:wrap} .li{flex-wrap:wrap} .li>div:first-child{flex:1 1 200px}
  .stats{flex-wrap:wrap} .stats>div{flex:1 1 45%;border-bottom:1px solid var(--line2)}
  .q{grid-template-columns:34px minmax(0,1fr)} .q .acts{grid-column:1 / -1;justify-content:flex-start}
  .cl{grid-template-columns:minmax(0,1fr) auto} .cl.h{display:none} .cl>*:nth-child(n+3){grid-column:1 / -1}
  .lot,.lot.src,.lot.lead,.lot.m{grid-template-columns:minmax(0,1fr)} .lot.lead>.row{justify-content:flex-start} .lot>*:nth-child(n+3){grid-column:auto}
  .how{grid-template-columns:minmax(0,1fr)}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:4px var(--pad) calc(4px + env(safe-area-inset-bottom,0px))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--ink2);font-size:11px;cursor:pointer;min-height:52px;position:relative}
  .bnav button.on{color:var(--accent);font-weight:600}

const ldist=l=>l.dist!==undefined?l.dist:INV[l.inv].dist;
const lotName=l=>l.title||`${INV[l.inv].n} · ${l.no}`;
const lotSub=l=>`${l.rooms} ${PUB.uk.rm} · ${String(l.area).replace('.',',')} м² · ${l.floor?l.floor+' '+PUB.uk.fl:'будинок'}`;
const unavailable=l=>l.av!=='available'||l.pr!=='present';
const fmtD=iso=>iso?iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4):'—';
const fmtAt=s=>new Date(s).toLocaleString(LOC[S.lang],{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysTo=iso=>Math.round((new Date(iso+'T12:00:00')-new Date(TODAY+'T12:00:00'))/864e5);
const ago=m=>m<2?t('justNow'):m<60?t('agoMin',m):m<1440?t('agoH',Math.round(m/60)):t('agoD',Math.round(m/1440));
const fresh=m=>m<=480?'ok':m<=1500?'warn':'bad';
const digits=s=>String(s).replace(/\D/g,'');
const stageName=k=>t(STAGE_KEY[k]||k);
const first=n=>String(n).split(' ')[0];
const regUntil=r=>addDays(r.date,r.days);
const utilsOf=c=>c.utils||(c.utils={power:'todo',water:'todo',heat:'todo',net:'todo',waste:'todo'});
const utilDone=c=>UT.filter(u=>utilsOf(c)[u[0]]==='done').length;
const showUtil=c=>['contract','transfer','closed'].includes(c.stage);
const hist=l=>l.h||[[l.seen,l.price]];
function priceDrop(l){const h=hist(l);if(h.length<2)return null;const a=h[h.length-2][1],b=h[h.length-1][1];if(b>=a)return null;const dt=daysTo(h[h.length-1][0]);if(dt<-30)return null;return {by:a-b,from:a,days:-dt}}
function notify(to,x,k='info',extra={}){S.notifs.unshift(Object.assign({id:uid('n'),to,t:'10:3'+Math.floor(Math.random()*9),x,k,done:false},extra))}
function act(cid,k,x){S.acts.unshift({cid,k,t:'16.10 10:3'+Math.floor(Math.random()*9),x})}
function toast(x){S.toast=x;render();clearTimeout(toast._t);toast._t=setTimeout(()=>{S.toast=null;render()},2800)}
const ym=s=>{const [m,y]=s.split('.');return +y*100+ +m};
const openProps=l=>S.props.some(p=>p.lid===l.id&&['sent','opened'].includes(p.delivery)&&p.outcome==='none'&&p.reaction!=='disliked');
function sourceFreq(s){if(s.state!=='ok')return null;if(s.type==='official_feed')return {k:'1×/день',fast:false};const fast=s.adaptive&&S.listings.some(l=>l.src===s.id&&openProps(l));return fast?{k:'кожні 3 год',fast:true}:{k:'2×/день',fast:false}}
</script>
<script>
/* ================= ПІДБІР ================= */
function score(c,l){
  const cr=c.crit; if(!cr) return null;
  if(l.pr==='removed'||l.av==='sold') return {gone:1};
  if(cr.cities.length&&!cr.cities.includes(lcity(l))) return {fail:'city'};
  if((cr.dists||[]).length&&!cr.dists.includes(ldist(l))) return {fail:'district'};
  if(l.price>cr.budget) return {fail:'budget'};
  if(cr.rooms.length&&!cr.rooms.includes(l.rooms)) return {fail:'rooms'};
  if(l.area<cr.minArea) return {fail:'area'};
  const p=Math.max(0,Math.min(30,Math.round(30*(1.15-l.price/cr.budget)/0.45)));
  const a=l.area>=cr.minArea*1.15?20:12, f=l.floor>=cr.floorMin?15:5, d=ym(l.done)<=cr.by?15:6;
  const fi=(cr.finish==='any'||cr.finish===l.fin)?10:3, x=l.bal?10:4;
  return {total:p+a+f+d+fi+x,parts:[['Ціна',p,30],['Площа',a,20],['Поверх',f,15],['Термін здачі',d,15],['Стан',fi,10],['Балкон / садок',x,10]]};
}
const rejectedBy=c=>new Set(propsOf(c.id).filter(p=>p.reaction==='disliked').map(p=>p.lid));
function matches(c){
  const seen=new Set(), rej=rejectedBy(c);
  return S.listings.map(l=>({l,s:score(c,l)})).filter(m=>m.s&&m.s.total&&!rej.has(m.l.id))
   .sort((a,b)=>(unavailable(a.l)-unavailable(b.l))||(b.s.total-a.s.total))
   .filter(m=>{const k=m.l.prop;if(seen.has(k))return false;seen.add(k);return true});
}
function failStats(c){const o={};S.listings.forEach(l=>{const s=score(c,l);if(s&&s.fail)o[s.fail]=(o[s.fail]||0)+1});return o}
const FAILKEY={city:'city',district:'districts',budget:'budget',rooms:'rooms',area:'minArea'};
const WIDEN={budget:'Бюджет +10%',district:'Усі райони міста',rooms:'±1 кімната',area:'Площа −5 м²',city:'Додати обидва міста'};
function widen(c,k){
  const cr=c.crit;
  if(k==='budget') cr.budget=Math.round(cr.budget*1.1/10000)*10000;
  if(k==='district') cr.dists=[];
  if(k==='rooms'){const a=Math.min(...cr.rooms),b=Math.max(...cr.rooms);cr.rooms=[...new Set([...cr.rooms,Math.max(1,a-1),b+1])].sort()}
  if(k==='area') cr.minArea=Math.max(20,cr.minArea-5);
  if(k==='city') cr.cities=['Wrocław','Poznań'];
}
const distsOf=cities=>[...new Set(cities.flatMap(c=>CITY_D[c]||[]))];
const distCount=d=>S.listings.filter(l=>ldist(l)===d&&!unavailable(l)).length;
const reasonLabel=k=>(REASONS[S.lang]||REASONS.uk)[k]||k;
/* Відмови навчають критерії */
function learn(c){
  const rej=propsOf(c.id).filter(p=>p.reaction==='disliked'&&p.reason), out=[], cr=c.crit; if(!cr) return out;
  const by={}; rej.forEach(p=>{(by[p.reason]=by[p.reason]||[]).push(Ls(p.lid))});
  Object.entries(by).forEach(([r,ls])=>{
    if(ls.length<2) return;
    if(r==='floor'){const n=Math.max(...ls.map(l=>l.floor))+1;if(cr.floorMin<n)out.push({r,n:ls.length,text:`Клієнт відхилив ${ls.length} лоти через поверх (${ls.map(l=>l.floor).join(' і ')}).`,btn:`Поверх від ${n}`,fn:()=>cr.floorMin=n})}
    if(r==='dear'){const b=Math.round(cr.budget*.9/10000)*10000;out.push({r,n:ls.length,text:`Клієнт відхилив ${ls.length} лоти як дорогі.`,btn:`Бюджет −10% (${zl(b)})`,fn:()=>cr.budget=b})}
    if(r==='area'){out.push({r,n:ls.length,text:`Клієнт відхилив ${ls.length} лоти через площу.`,btn:'Мін. площа +5 м²',fn:()=>cr.minArea+=5})}
    if(r==='district'){const ds=[...new Set(ls.map(ldist))];out.push({r,n:ls.length,text:`Клієнт відхилив лоти в районах: ${ds.join(', ')}.`,btn:'Виключити ці райони',fn:()=>{const all=cr.dists.length?cr.dists:distsOf(cr.cities);cr.dists=all.filter(d=>!ds.includes(d))}})}
  });
  return out;
}
/* Нотатка → критерії (імітація LLM: ім'я й телефон до моделі не йдуть) */
function parseNote(txt){
  const s=txt.toLowerCase(), o={}, found=[];
  let m=s.match(/до\s*(\d[\d\s]*)\s*(тис|k|000|zł|злот)?/);
  if(m){let n=parseInt(m[1].replace(/\s/g,''),10);if(n<5000)n*=1000;if(/тис|k/.test(m[2]||'')&&n<5000)n*=1000;o.budget=n;found.push(['Бюджет до',zl(n)])}
  m=s.match(/(\d)\s*[-–]\s*(\d)\s*-?\s*(кімн|комн|pok)/);
  if(m){o.rooms=[];for(let i=+m[1];i<=+m[2];i++)o.rooms.push(i);found.push(['Кімнати',o.rooms.join(', ')])}
  else{m=s.match(/(\d)\s*-?\s*(кімн|комн|pok)/);if(m){o.rooms=[+m[1]];found.push(['Кімнати',m[1]])}}
  m=s.match(/від\s*(\d+)\s*(-го|го)?\s*(поверх|этаж|piętr)/); if(m){o.floorMin=+m[1];found.push(['Поверх від',m[1]])}
  m=s.match(/від\s*(\d+)\s*м/); if(m){o.minArea=+m[1];found.push(['Мін. площа',m[1]+' м²'])}
  if(/під ключ|pod klucz/.test(s)){o.finish='pod klucz';found.push(['Стан','pod klucz'])}
  const cities=[];if(/wrocław|вроцлав/.test(s))cities.push('Wrocław');if(/poznań|познан/.test(s))cities.push('Poznań');
  if(cities.length){o.cities=cities;found.push(['Місто',cities.join(' і ')])}
  const ds=distsOf(['Wrocław','Poznań']).filter(d=>s.includes(d.toLowerCase()));
  if(ds.length){o.dists=ds;found.push(['Райони',ds.join(', ')])}
  return {o,found};
}
function classifyReply(txt){
  const s=txt.toLowerCase();
  if(/дорого|drogo|дороговато/.test(s)) return {r:'disliked',reason:'dear',why:'згадано «дорого»'};
  if(/поверх|этаж|piętro/.test(s)&&/(низьк|нижч|ниже|za nisko)/.test(s)) return {r:'disliked',reason:'floor',why:'згадано низький поверх'};
  if(/показ|огляд|оглян|obejrz|prezentac|посмотр/.test(s)) return {r:'wants_viewing',why:'просить показ'};
  if(/ні\b|не підходить|nie\b|нет\b/.test(s)) return {r:'disliked',reason:'other',why:'відмова без причини'};
  if(/так\b|цікав|подоба|podoba|tak\b|нравит|гарн|ok\b/.test(s)) return {r:'liked',why:'позитивна відповідь'};
  return null;
}

/* ================= СТАН ПРОПОЗИЦІЇ ================= */
function pState(p){
  const l=Ls(p.lid);
  if(p.outcome==='reserved') return {k:'reserved',cls:'ok',label:t('pReserved')};
  if(unavailable(l)&&p.reaction!=='disliked') return {k:'unavail',cls:'bad',label:t('pUnavail')};
  if(p.outcome==='viewing'&&p.slot) return {k:'viewing',cls:'ok',label:t('pViewing')+' '+fmtAt(p.slot)};
  if(p.reaction==='disliked') return {k:'disliked',cls:'plain',label:t('pDisliked')+(p.reason?': '+reasonLabel(p.reason):'')};
  if(p.reaction==='wants_viewing') return {k:'wants',cls:'info',label:t('pWants')};
  if(p.reaction==='liked') return {k:'liked',cls:'info',label:t('pLiked')};
  if(p.delivery==='opened') return {k:'opened',cls:'warn',label:t('pOpened')};
  if(p.delivery==='sent') return {k:'sent',cls:'warn',label:t('pSent')};
  return {k:'draft',cls:'plain',label:t('pDraft')};
}
function avPill(l){
  if(l.pr==='removed') return '<span class="pill bad">Знято, ймовірно продано</span>';
  if(l.pr==='missing') return '<span class="pill warn">Зник зі списку, перевіряється</span>';
  return {available:'<span class="pill ok">Wolne</span>',reserved:'<span class="pill warn">Rezerwacja</span>',sold:'<span class="pill bad">Sprzedane</span>',unknown:'<span class="pill">'+t('unknown')+'</span>'}[l.av];
}
const freshPill=l=>l.manual&&l.manual.mode==='manual'?'<span class="pill warn plain" title="Статус перевіряє людина">без автоперевірки</span>':`<span class="pill ${fresh(l.ver)} plain" title="Останній успішний розбір джерела">${t('verified')} ${ago(l.ver)}</span>`;
function dropPill(l){const d=priceDrop(l);return d?`<span class="pill ok plain" title="Було ${zl(d.from)}">−${zl(d.by)} за ${d.days} дн</span>`:''}
function statusText(l){return l.pr==='present'?({reserved:'Rezerwacja',sold:'Sprzedane',unknown:'невідомо',available:'Wolne'})[l.av]:'знято / перевіряється'}

function autoDone(cid,re,why){S.rems.forEach(r=>{if(!r.done&&r.cid===cid&&re.test(r.title)){r.done=true;r.h.push(['16.10 10:3x','Виконано автоматично: '+why])}})}
function widenGain(c,k){
  const base=matches(c).filter(m=>!unavailable(m.l)).length, tmp={...c,crit:JSON.parse(JSON.stringify(c.crit))};
  widen(tmp,k); return matches(tmp).filter(m=>!unavailable(m.l)).length-base;
}
function pickSet(c,ms,inP){
  const avail=ms.filter(m=>!unavailable(m.l)&&!inP.has(m.l.id)).map(m=>m.l.id), sel=new Set(avail.slice(0,3));
  (S.pickOff[c.id]||[]).forEach(x=>sel.delete(x)); (S.pickOn[c.id]||[]).forEach(x=>{if(avail.includes(x))sel.add(x)});
  return sel;
}
/* ================= ЧЕРГА «СЬОГОДНІ» ================= */
const ruleOn=k=>{const r=S.rules.find(x=>x.k===k);return !k||!r||r.on};
const remsFor=()=>S.rems.filter(r=>!r.done&&ruleOn(r.rule)&&(S.role==='owner'||r.u===me().id));
const overdue=r=>new Date(r.due)<NOW;
function alerts(){
  const out=[];
  vis().forEach(c=>propsOf(c.id).forEach(p=>{const l=Ls(p.lid);if(unavailable(l)&&['sent','opened'].includes(p.delivery)&&p.outcome==='none'&&p.reaction!=='disliked')out.push({c,p,l})}));
  return out;
}
const myNotifs=()=>S.notifs.filter(n=>!n.done&&(n.to===me().id||(S.role==='owner'&&n.to==='u0')));
function queue(){
  const out=[];
  alerts().forEach(a=>out.push({key:'al'+a.p.id,g:'urgent',tone:'bad',icon:'alert',tag:'Лот недоступний',title:`${lotName(a.l)} тепер ${statusText(a.l)}`,
    sub:`Пропонувався клієнту ${a.c.name}. Клієнт на своїй сторінці бачить «${PUB.uk.un}».`,act:{l:'Знайти заміну',a:'openClient',id:a.c.id,v:'match'}}));
  if(S.role!=='realtor') S.sources.filter(s=>s.state==='needs_review').forEach(s=>out.push({key:'sr'+s.id,g:'urgent',tone:'bad',icon:'sources',tag:'Джерело',title:`${INV[s.inv].n}: джерело потребує перегляду`,sub:'Сайт змінив верстку. Дані заморожено, AI підготував виправлення.',act:{l:'Переглянути виправлення',a:'selSource',id:s.id}}));
  if(S.role!=='admin') S.leads.filter(l=>l.st==='new'&&(S.role==='owner'||l.u===me().id)&&srcOn(l)).forEach(l=>out.push({key:'ld'+l.id,g:'urgent',tone:'info',icon:'leads',tag:'Новий запит',title:`${l.name} · ${LSRC[l.src].n}`,sub:`${fmtAt(l.at)} · ${l.note}`,
    act:S.ints.tel?{l:'Зателефонувати',a:'leadCall',id:l.id}:{l:'Написати',a:'leadWrite',id:l.id},more:S.ints.tel?[['Написати в '+l.ch,'leadWrite',l.id]]:[]}));
  myNotifs().forEach(n=>{
    const c=n.cid&&C(n.cid), base={key:'nf'+n.id,sub:n.t+(c?' · '+c.name:''),ok:{a:'notifDone',id:n.id}};
    if(n.k==='price') out.push(Object.assign({g:'urgent',tone:'warn',icon:'euro',tag:'Ціна',title:n.x,act:{l:'Надіслати оновлення',a:'openClient',id:n.cid,v:'props'}},base));
    else if(n.k==='reply') out.push(Object.assign({g:'urgent',tone:'info',icon:'heart',tag:'Відповідь',title:n.x,act:{l:t('open'),a:'openClient',id:n.cid,v:'props'}},base));
    else if(n.k==='match') out.push(Object.assign({g:'today',tone:'info',icon:'lots',tag:'Нові збіги',title:n.x,act:{l:'Відкрити підбір',a:'openClient',id:n.cid,v:'match'}},base));
    else out.push(Object.assign({g:'today',tone:'info',icon:'note',tag:'Сповіщення',title:n.x},base));
  });
  S.views.filter(v=>(S.role==='owner'||v.u===me().id)&&v.st==='pending_confirm').forEach(v=>out.push({key:'vw'+v.id,g:'urgent',tone:'warn',icon:'viewings',tag:'Показ',title:`${C(v.cid).name} обрала час: ${fmtAt(v.at)}`,sub:`${lotName(Ls(v.lid))}. Підтвердіть із відділом продажу.`,act:{l:'Підтвердити показ',a:'viewConfirm',id:v.id}}));
  remsFor().sort((a,b)=>a.due.localeCompare(b.due)).forEach(r=>{
    const c=C(r.cid), od=overdue(r), d=daysTo(r.due.slice(0,10)), g=od?'urgent':d<=0?'today':'later';
    const tab=/pre-approval|Реєстрація|Передача|комунік|Завдаток/i.test(r.title)?'overview':/реакці|збіг|підбірк/i.test(r.title)?'props':'overview';
    const callback=c&&S.ints.tel&&/Передзвонити|Зателефонувати/i.test(r.title);
    out.push({key:'rm'+r.id,g,tone:od?'bad':d<=0?'warn':'',icon:'reminders',tag:r.kind==='auto'?'Авто-правило':'Нагадування',title:r.title,sub:`${c?c.name+' · ':''}${od?t('overdue')+' · ':''}до ${fmtAt(r.due)}`,
      act:callback?{l:'Зателефонувати',a:'callClient',id:c.id}:c?{l:t('open'),a:'openClient',id:c.id,v:tab}:null,ok:{a:'remDone',id:r.id},more:[[t('snooze'),'remSnooze',r.id]]});
  });
  S.views.filter(v=>(S.role==='owner'||v.u===me().id)&&v.st==='confirmed'&&daysTo(v.at.slice(0,10))<=2).forEach(v=>out.push({key:'vc'+v.id,g:'today',tone:'ok',icon:'viewings',tag:'Показ',title:`${fmtAt(v.at)} · ${C(v.cid).name}`,sub:`${lotName(Ls(v.lid))} · ${DV(INV[Ls(v.lid).inv].dev).n}`,act:{l:t('open'),a:'openClient',id:v.cid,v:'props'}}));
  return out;
}
</script>
<script>
/* ================= ОБОЛОНКА ================= */
const PAGES={today:['owner','realtor'],leads:['owner','realtor'],clients:['owner','realtor'],lots:['owner','realtor','admin'],viewings:['owner','realtor'],reminders:['owner','realtor'],secondary:['owner','realtor'],deals:['owner','realtor'],
  team:['owner'],devs:['owner'],users:['owner'],io:['owner'],sources:['owner','admin'],integr:['owner','admin']};
const GROUPS=[['gWork',['today','leads','clients','lots','viewings']],['gOwner',['deals','team']],['gSet',['devs','users','io','sources','integr']]];
const defaultPage=()=>S.role==='admin'?'sources':'today';
const rowMenu=(id,items)=>`<span style="position:relative;display:inline-block"><button class="btn icon sm" data-a="menu" data-id="${esc(id)}" aria-label="Ще" aria-haspopup="true" title="Ще">${ic('more','f')}</button>${S.menu===id?`<div class="pop r">${items.map(i=>`<button class="it" data-a="${i[1]}" data-id="${esc(i[2]==null?'':i[2])}"${i[3]!==undefined?` data-v="${esc(i[3])}"`:''}>${i[0]}</button>`).join('')}</div>`:''}</span>`;
function badgeFor(p){
  if(p==='leads'){const n=S.leads.filter(l=>l.st==='new'&&(S.role==='owner'||l.u===me().id)&&srcOn(l)).length;return n?`<span class="cnt">${n}</span>`:''}
  if(p==='today'){const n=queue().filter(q=>q.g==='urgent').length;return n?`<span class="cnt">${n}</span>`:''}
  if(p==='sources'&&S.sources.some(s=>s.state==='needs_review'))return '<span class="cnt">!</span>';
  if(p==='reminders'){const n=remsFor().filter(overdue).length;return n?`<span class="cnt soft">${n}</span>`:''}
  return '';
}
const pageHead=(title,sub,right='')=>`<div class="ph"><div><h1>${esc(title)}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="row">${right}</div></div>`;
const B=(label,a,id,v,cls='',extra='')=>`<button class="btn ${cls}" data-a="${a}"${id!==undefined?` data-id="${esc(id)}"`:''}${v!==undefined?` data-v="${esc(v)}"`:''} ${extra}>${label}</button>`;

function demoPanel(x=''){
  return `<div class="box">
   <div class="field"><label for="roleSel${x}">${t('viewAs')}</label><select id="roleSel${x}" data-c="role"><option value="realtor" ${S.role==='realtor'?'selected':''}>${t('roleRealtor')} · Marta</option><option value="owner" ${S.role==='owner'?'selected':''}>${t('roleOwner')} · Andrzej</option><option value="admin" ${S.role==='admin'?'selected':''}>${t('roleAdmin')}</option></select></div>
   <div class="field"><label for="langSel${x}">${t('lang')}</label><select id="langSel${x}" data-c="lang">${Object.entries({uk:'Українська',pl:'Polski',ru:'Русский'}).map(([k,v])=>`<option value="${k}" ${S.lang===k?'selected':''}>${v}</option>`).join('')}</select></div>
   <label>${t('demoScen')}</label>
   ${B('Лот A.4.3 зарезервували','demo','reserve','','sm')}${B('З’явився новий лот A.9.1','demo','newlot','','sm')}${B('Ціна на A.3.2 знизилась','demo','drop','','sm')}
   ${B('Клієнт відповів 👍 на сторінці','demo','reply','','sm')}${B('Клієнт обрав час показу','demo','slot','','sm')}${B('Прийшов лід з Facebook','demo','lead','','sm')}${B('Сайт Naturama змінив верстку','demo','break','','sm')}${B('Скинути все','demo','reset','','sm ghost')}

}
function cMatch(c){
  if(!c.crit) return `<div class="card"><div class="empty"><h2>Критерії ще не заповнено</h2><p class="small" style="margin-top:4px">Три кроки до першої підбірки.</p>

  const sel=pickSet(c,ms,inP), total=sel.size+drafts.length;

   ${wid.length?`<div class="card soft"><div class="row"><span class="small muted">Відсіяно фільтрами. Розширити пошук:</span>${wid.map(x=>B(WIDEN[x.r]+` <span class="mono xs">+${x.g} лот.</span>`,'widen',c.id,x.r,'sm')).join('')}</div></div>`:''}
   <div class="row"><div class="small muted" style="flex:1">${ms.length} збігів. Три найкращі вільні вже відмічені, змініть галочками.</div>${B('Надіслати вибрані ('+total+')','sendPicked',c.id,'','pri',total?'':'disabled')}</div>
   ${ms.length?`<div class="card tight">${ms.map(m=>lotRowMatch(c,m,inP.has(m.l.id),sel.has(m.l.id))).join('')}</div>`:`<div class="note warn">Збігів немає. Розширте пошук або змініть критерії.</div>`}
   ${rej.length?`<div class="small muted">Відхилено клієнтом: ${rej.map(p=>`${esc(lotName(Ls(p.lid)))} (${reasonLabel(p.reason)||'без причини'})`).join(', ')}. Ці лоти не показуються в підборі.</div>`:''}</div>`;
}
/* --- Пропозиції --- */
function propActions(p,c){
  const s=pState(p), v=S.views.find(x=>x.cid===p.cid&&x.lid===p.lid);

   return `<div class="lot"><div><div class="name" role="button" tabindex="0" data-a="lotOpen" data-id="${l.id}">${esc(lotName(l))}</div><div class="small muted">${lotSub(l)} · ${zl(l.price)}</div></div>

   ${S.open['pd'+p.id]?`<div style="grid-column:1 / -1" class="note"><div class="grid g3 small"><div><b>Доставка</b><br>${dl}</div><div><b>Реакція клієнта</b><br>${rx}${p.reason?' · '+reasonLabel(p.reason):''}</div><div><b>Результат</b><br>${oc}${p.slot?' · '+fmtAt(p.slot):''}</div></div></div>`:''}</div>`}).join('')||`<div class="empty">Ще немає пропозицій. Відмітьте лоти на вкладці «Підбір» і натисніть «Надіслати вибрані».</div>`}</div></div>`;
}
function pClient(){

  return `<div class="row">${B('← '+t('clients'),'go','clients','','sm ghost')}</div>

  <div class="tabs">${tabs.map(x=>`<button class="${S.tab===x[0]?'on':''}" data-a="tab" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>${body}`;

<script>
const typeLabel=s=>({developer_site:'сайт забудовника',aggregator:'агрегатор',official_feed:'офіційний фід dane.gov.pl',tracked_link:'окреме посилання'})[s.type];

/* ================= ЛОТИ ================= */
function lotRowPlain(l){

}
function groupedListings(list){

  if(man.length) groups.push({key:'_manual',title:'Додані вручну',ls:man});
  if(!groups.length) return `<div class="card"><div class="empty">${t('noResults')}</div></div>`;
  const allOpen=groups.every(g=>S.open[g.key]);
  return `<div class="small muted">Натисніть на забудовника, щоб побачити лоти.</div>`+groups.map(g=>{
    const full=g.dev?S.listings.filter(l=>!l.manual&&INV[l.inv].dev===g.dev):S.listings.filter(l=>l.manual);
    const open=!!S.open[g.key], av=full.filter(l=>!unavailable(l)).length, rs=full.filter(l=>l.av==='reserved').length, invs=[...new Set(g.ls.map(l=>l.inv))];
    const vel=g.dev?Math.round(invs.reduce((a,i)=>a+INV[i].vel,0)/invs.length):0, srcs=g.dev?S.sources.filter(s=>invs.includes(s.inv)):[];
    const d=g.dev&&DV(g.dev);
    return `<div class="card tight"><div class="row nw" style="padding:14px 16px"><div role="button" tabindex="0" data-a="toggleDev" data-id="${g.key}" style="cursor:pointer;flex:1;min-width:0"><div class="row" style="gap:8px"><span class="mono muted">${open?'▾':'▸'}</span><b style="font-size:15px">${esc(g.title)}</b><span class="pill ok plain">Wolne ${av}</span><span class="pill warn plain">Rezerwacja ${rs}</span></div>
      <div class="small muted" style="margin-left:22px">${g.ls.length}${g.ls.length!==full.length?' з '+full.length:''} лотів${g.dev?` · ${invs.length} інвестицій · ${d.partner?'партнер':'без партнерської угоди'}${S.role==='owner'&&d.partner?`, комісія ${d.pct}%`:''}${vel?` · лоти йдуть у резерв за ~${vel} дн`:''}`:' · окремі посилання'}</div></div>
      </div>
     ${open?`<div style="padding:0 0 4px">${srcs.length?`<div class="sub small" style="margin:0 16px 4px;padding-top:0;border:0">${srcs.map(s=>{const f=sourceFreq(s);return `<div class="li"><span><b>${esc(INV[s.inv].n)}</b> <span class="mono muted">${esc(s.url)}</span></span><span class="row nw"><span class="pill ${s.type==='official_feed'?'ok':s.type==='aggregator'?'warn':'info'} plain">${typeLabel(s)}</span>${f?`<span class="pill ${f.fast?'info':''} plain" title="${f.fast?'Частіше, бо лоти є у відкритих підбірках':''}">${f.k}</span>`:`<span class="pill warn plain">пауза</span>`}<span class="pill ${fresh(s.last)} plain">${ago(s.last)}</span></span></div>`}).join('')}</div>`:''}${g.ls.map(lotRowPlain).join('')}</div>`:''}</div>`;

function lotsTabs(){return `<div class="seg" role="group" aria-label="Тип лотів"><button class="${S.lotTab!=='sec'?'on':''}" data-a="lotTab" data-id="new">Новобудови</button><button class="${S.lotTab==='sec'?'on':''}" data-a="lotTab" data-id="sec">Вторинка</button></div>`}

  `<div class="card"><div class="row"><input type="search" id="lq" data-s="lq" value="${esc(S.lq)}" placeholder="Номер лоту або інвестиція" style="max-width:230px" aria-label="Пошук лоту"><select data-c="linv" style="max-width:200px" aria-label="Інвестиція"><option value="">Усі інвестиції</option>${invs.map(i=>`<option value="${i}" ${S.linv===i?'selected':''}>${INV[i].n}</option>`).join('')}</select>

   ${B('Райони'+(S.ldist.length?' ('+S.ldist.length+')':''),'toggle','ldOpen','','sm')}</div>

}
/* ================= ПОКАЗИ ================= */

  (g?`<div class="alert info"><div><b>Груповий показ:</b> ${esc(C(g[0].cid).name)} і ${esc(C(g[1].cid).name)} дивляться ${esc(INV[Ls(g[0].lid).inv].n)}.<div class="small">Один виїзд замість двох: ${fmtAt(g[0].at)}. Другий клієнт отримає запит на новий час.</div></div>${B('Об’єднати в груповий показ','groupViews',g[0].id,g[1].id,'sm pri')}</div>`:'')+
  `<div class="grid g21"><div class="card"><header><h2>Заплановані</h2></header><div class="lst">${vw.map(v=>{const l=Ls(v.lid),st=VST[v.st];return `<div class="li" style="align-items:flex-start"><div><b>${fmtAt(v.at)}</b> ${v.group?'<span class="pill info plain">груповий показ</span>':''}<div>${esc(C(v.cid).name)} · ${esc(lotName(l))}</div><div class="small muted">Відділ продажу ${esc(DV(INV[l.inv].dev).n)}${DV(INV[l.inv].dev).contact!=='—'?' · '+esc(DV(INV[l.inv].dev).contact):''}. Адреса й контакт видно лише ріелтору.</div>

/* ================= НАГАДУВАННЯ ================= */
function pReminders(){

   ${list.map(l=>`<div class="lot lead"><div><b>${esc(l.name)}</b> ${lstPill(l)}<div class="small muted"><span class="mono">${esc(l.phone)}</span> · ${esc(l.ch)} · ${{uk:'укр',pl:'pl',ru:'рос'}[l.lang]}${S.role==='owner'?' · '+esc(first(U(l.u).name)):''}</div>

  <p class="small muted">Джерела запитів: Meta Lead Ads (webhook), листи з Otodom і OLX на адресу агенції (розбір листа), форма на сайті, рекомендація або ручне внесення. Згода RODO ставиться галочкою у формі клієнта, коли запит стає клієнтом.</p>`;

    ${f.consent&&S.llm?`<div class="row">${B('Заповнити з запису (ШІ)','callSample','','','sm')}${f.cid&&C(f.cid).crit?B('Розібрати нотатку → критерії','callParse','','','sm',f.note.trim()?'':'disabled'):''}</div>`:''}
    ${f.res?(f.res.found.length?`<div class="note info"><div class="small muted">Знайдено в нотатці. Застосується лише після збереження:</div><div class="chips" style="margin-top:6px">${f.res.found.map(x=>`<span class="pill info plain">${esc(x[0])}: ${esc(x[1])}</span>`).join('')}</div></div>`:'<div class="small muted">У нотатці не знайдено критеріїв.</div>'):''}

   ${fld('Джерело','nls',sel('nls','nl.src',f.src,Object.entries(LSRC).map(([k,v])=>[k,v.n])))}${fld('Канал','nlc',sel('nlc','nl.ch',f.ch,CHANNELS.concat(['Телефон','E-mail'])))}${fld('Мова','nll',sel('nll','nl.lang',f.lang,[['uk','Українська'],['pl','Polski'],['ru','Русский']]))}</div>

<script>
/* ================= МОДАЛЬНІ ВІКНА ================= */
const shell=(title,body,foot='',wide='')=>`<div class="ov" data-a="ovClose"><div class="modal ${wide}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2 style="font-size:17px">${esc(title)}</h2><button class="btn ghost sm" data-a="closeModal" aria-label="${t('close')}">${ic('close')}</button></div>${body}${foot?`<div class="mf">${foot}</div>`:''}</div></div>`;
const fld=(label,id,inner,cls='')=>`<div class="field ${cls}"><label for="${id}">${label}</label>${inner}</div>`;
const inp=(id,path,val,o={})=>`<input id="${id}" type="${o.type||'text'}" value="${esc(val)}" data-f="${path}"${o.live?' data-live="1"':''}${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.step?` step="${o.step}"`:''}>`;
const sel=(id,path,val,opts,live)=>`<select id="${id}" data-f="${path}"${live?' data-live="1"':''}>${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const fget=(p)=>p.split('.').reduce((o,k)=>o&&o[k],S.form);
const fset=(p,v)=>{const ks=p.split('.');let o=S.form;ks.slice(0,-1).forEach(k=>{o=o[k]=o[k]||{}});o[ks[ks.length-1]]=v};
const clientOpts=(withEmpty)=>(withEmpty?[['','— без клієнта —']]:[]).concat(vis().map(c=>[c.id,c.name]));
const fmtAtL=(s,lang)=>new Date(s).toLocaleString(LOC[lang],{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const tokenOf=c=>'k'+digits(c.phone).slice(-4)+'x9q2';
const normPhone=s=>digits(s).slice(-9);

function mNewClient(){
  const f=S.form.nc, ph=normPhone(f.phone), dup=ph.length>=9?S.clients.find(c=>normPhone(c.phone)===ph):null, mineDup=dup&&(S.role==='owner'||dup.u===me().id);
  const valid=f.name.trim().length>1&&digits(f.phone).length>=9&&f.contract&&f.consent&&!dup;
  return shell(t('newClient'),`<p class="small muted">У систему потрапляють лише клієнти, які вже підписали договір співпраці.${f.leadId?' Дані перенесено із запиту.':''}</p>
   <div class="grid g2">${fld('Ім’я та прізвище','ncn',inp('ncn','nc.name',f.name,{live:1,ph:'Напр.: Katarzyna Nowak'}))}${fld('Телефон','ncp',inp('ncp','nc.phone',f.phone,{live:1,ph:'+48 …',type:'tel'}))}</div>
   <div class="xs muted">Для демо: номер +48 513 090 311 уже є в системі.</div>
   ${dup?(mineDup?`<div class="note warn"><b>Такий клієнт уже є:</b> ${esc(dup.name)} (${esc(U(dup.u).name)}, етап «${stageName(dup.stage)}»). ${B('Відкрити існуючого','openClient',dup.id,'overview','sm')}</div>`:
     `<div class="note bad"><b>Цей номер уже веде інший ріелтор:</b> ${esc(U(dup.u).name)}${dup.reg?`, клієнт зареєстрований у ${esc(DV(dup.reg.dev).n)} до ${fmtD(regUntil(dup.reg))}`:''}. Конфлікт вирішує власник. ${B('Повідомити власника','dupAsk',dup.id,'','sm')}</div>`):''}
   <div class="grid g2">${fld('Мова клієнта','ncl',sel('ncl','nc.lang',f.lang,[['uk','Українська'],['pl','Polski'],['ru','Русский']]))}${fld('Канал зв’язку','ncc',sel('ncc','nc.ch',f.ch,CHANNELS))}
   ${fld('Джерело ліда','ncs',sel('ncs','nc.lead',f.lead,['Otodom','Рекомендація','Instagram','Facebook','Telegram','Сайт агенції','Інше']))}${fld('Фінансування','ncf',sel('ncf','nc.fin',f.fin,['Кредит','Готівка','Попереднє погодження','Не з’ясовано']))}
   ${S.role==='owner'?fld('Ріелтор','ncu',sel('ncu','nc.u',f.u,S.users.filter(u=>u.role==='realtor'&&u.active).map(u=>[u.id,u.name]))):''}</div>
   <label class="row nw" style="cursor:pointer"><input type="checkbox" data-f="nc.contract" data-live="1" ${f.contract?'checked':''}> Договір співпраці підписано</label>
   <label class="row nw" style="cursor:pointer"><input type="checkbox" data-f="nc.consent" data-live="1" ${f.consent?'checked':''}> Згода RODO отримано (дата й джерело запишуться в картку)</label>`,
   B(t('cancel'),'closeModal')+B(t('create'),'createClient','','','pri',valid?'':'disabled'));
}
function mNote(){
  const f=S.form.nt, kinds=[['call','Дзвінок'],['note','Нотатка'],['msg_in','Клієнт написав'],['msg_out','Ви написали']];
  return shell(t('quickNote'),`${fld('Клієнт','ntc',sel('ntc','nt.cid',f.cid,clientOpts()))}
   <div class="seg" role="group">${kinds.map(k=>`<button class="${f.kind===k[0]?'on':''}" data-a="noteKind" data-id="${k[0]}">${k[1]}</button>`).join('')}</div>
   ${fld('Що сталося','ntt',`<textarea id="ntt" data-f="nt.text" placeholder="Напр.: дзвінок 8 хв, бюджет не змінився, хочуть тихий двір">${esc(f.text)}</textarea>`)}
   ${fld('Наступний крок (необов’язково)','ntn',inp('ntn','nt.next',f.next,{ph:'Напр.: надіслати 3 варіанти до п’ятниці'}))}`,
   B(t('cancel'),'closeModal')+B(t('save'),'saveNote','','','pri'));
}
function mNewRem(){
  const f=S.form.nr;
  return shell(t('newRem'),`${fld('Клієнт','nrc',sel('nrc','nr.cid',f.cid,clientOpts(1)))}${fld('Що зробити','nrt',inp('nrt','nr.title',f.title,{ph:'Напр.: надіслати оновлену підбірку'}))}${fld('Коли','nrd',inp('nrd','nr.due',f.due,{type:'datetime-local'}))}`,
   B(t('cancel'),'closeModal')+B(t('create'),'saveRem','','','pri'));
}
function mManualLot(){
  const f=S.form.ml, run=f.chk==='run';
  return shell('Додати лот вручну',`<p class="small muted">Посилання обов’язкове. Перед збереженням система перевіряє через Jina, чи видно на сторінці статус і ціну.</p>
   ${fld('Посилання на оголошення чи сторінку лоту','mlu',inp('mlu','ml.url',f.url,{ph:'https://…',live:1}))}
   <div class="row">${B(run?'<span class="spin"></span> Перевіряю…':(f.chk&&f.chk!=='run'?'Перевірити ще раз':'Перевірити через Jina'),'lotCheck','','','',(run||!f.url.trim())?'disabled':'')}<span class="small muted">Для демо: посилання з «olx» не читається (403).</span></div>
   ${f.chk==='ok'?`<div class="note"><b>Статус і ціна видно.</b> Лот перевірятиметься разом з іншими джерелами. Знайдено: Wolne, ${zl(f.price)}.</div>`:''}
   ${f.chk==='fail'?`<div class="note warn"><b>Сторінку не вдалося прочитати (403, захист від ботів).</b> Змініть посилання або збережіть із ручним контролем: лот отримає позначку «без автоперевірки» і нагадування перевіряти вручну кожні 3 дні.</div>`:''}
   <div class="grid g2">${fld('Назва','mlt',inp('mlt','ml.title',f.title,{live:1,ph:'Напр.: Łazarz, ul. Głogowska 12/4'}))}${fld('Місто','mlcity',sel('mlcity','ml.city',f.city,['Poznań','Wrocław']))}
   ${fld('Ціна, zł','mlp',inp('mlp','ml.price',f.price,{type:'number',step:'1000'}))}${fld('Площа, м²','mla',inp('mla','ml.area',f.area,{type:'number'}))}${fld('Кімнати','mlr',inp('mlr','ml.rooms',f.rooms,{type:'number'}))}</div>`,
   B(t('cancel'),'closeModal')+(f.chk==='fail'?B('Зберегти з ручним контролем','lotSave','','manual','',f.title.trim()?'':'disabled'):B('Зберегти з автомоніторингом','lotSave','','auto','pri',f.chk==='ok'&&f.title.trim()?'':'disabled')));
}
function mAddLink(){
  const f=S.form.al;
  return shell('Додати оголошення вторинки',`${fld('Посилання','alu',inp('alu','al.url',f.url,{ph:'https://www.otodom.pl/…',live:1}))}${fld('Для якого клієнта','alc',sel('alc','al.cid',f.cid,clientOpts(1)))}
   <div class="row">${B(f.stage===1?'<span class="spin"></span> Читаю…':'Прочитати через Jina','linkRead','','','',(f.stage===1||!f.url.trim())?'disabled':'')}</div>
   ${f.stage===2?`<div class="note"><b>Прочитано:</b> ${esc(f.title)} · ${zl(f.price)}. Перевірте поля й підтвердьте. Система стежитиме щодня.</div>
   <div class="grid g2">${fld('Назва','alt',inp('alt','al.title',f.title))}${fld('Ціна, zł','alp',inp('alp','al.price',f.price,{type:'number'}))}</div>`:''}`,
   B(t('cancel'),'closeModal')+B('Підтвердити і стежити щодня','linkSave','','','pri',f.stage===2?'':'disabled'));
}

/* --- Надсилання підбірки --- */
function composeMsg(){
  const f=S.form.send,c=C(f.cid),ok=f.pids.filter(pid=>f.res[pid]!=='gone');
  const list=ok.map(pid=>{const l=Ls(S.props.find(p=>p.id===pid).lid);return `• ${lotName(l)} · ${l.rooms} ${PUB[c.lang].rm} · ${String(l.area).replace('.',',')} м² · ${zl(l.price)}`}).join('\n');
  f.text=TPL[c.lang](first(c.name),first(me().name),ok.length,list,'https://kabinet.example/s/'+tokenOf(c));
}
function mSend(){
  const f=S.form.send, c=C(f.cid), ok=f.pids.filter(pid=>f.res[pid]&&f.res[pid]!=='gone');
  if(f.step===3) return shell('Готово',`<div class="empty">${ic('check')}<h2 style="margin-top:6px">Підбірку позначено як надіслану</h2><p class="small" style="margin-top:4px">Додано запис у стрічку клієнта та нагадування «немає реакції 48 год». Нагадування «надіслати підбірку» закрито автоматично. Клієнт відкриє сторінку за посиланням, і статус зміниться на «Відкрито».</p></div>`,B('До пропозицій','sendDone',c.id,'','pri'));
  const wa=`https://wa.me/${digits(c.phone)}?text=${encodeURIComponent(f.text)}`;
  const body=`${f.checking?`<div class="row"><span class="spin"></span> Перевіряю актуальність ${f.pids.length} лотів на сайтах забудовників…</div>`:'<div class="small muted">Актуальність перевірено щойно. Якщо джерело читали менше 30 хвилин тому, береться готовий результат.</div>'}
   <div class="lst small">${f.pids.map(pid=>{const p=S.props.find(x=>x.id===pid),l=Ls(p.lid),r=f.res[pid];return `<div class="li"><div><b>${esc(lotName(l))}</b> <span class="muted">${lotSub(l)} · ${zl(l.price)}</span></div>${!r?'<span class="spin"></span>':r==='ok'?'<span class="pill ok">актуально</span>':r==='price'?'<span class="pill info">ціна змінилась, нова в тексті</span>':'<span class="pill bad">недоступний, виключено</span>'}</div>`}).join('')}</div>
   ${f.checking?'':`<div class="seg" role="group" aria-label="Канал">${CHANNELS.filter(ch=>ch!=='Messenger'||S.ints.messenger).map(ch=>`<button class="${f.channel===ch?'on':''}" data-a="chan" data-id="${ch}">${ch}</button>`).join('')}</div>
   ${fld('Текст повідомлення, мова клієнта: '+{uk:'українська',pl:'polski',ru:'русский'}[c.lang],'sdt',`<textarea id="sdt" data-f="send.text" style="min-height:150px">${esc(f.text)}</textarea>`)}
   ${f.channel==='WhatsApp'?`<div class="note small">Кнопка відкриє чат з готовим текстом. Надсилаєте ви самі. У прототипі посилання веде на wa.me.</div>`:f.channel==='Messenger'?`<div class="note small">Messenger не підставляє текст за посиланням. Скопіюйте текст і відкрийте чат. Писати першим зі сторінки агенції можна лише клієнту, який уже писав сторінці.</div>`:`<div class="note small">${f.channel} не підставляє текст з посилання. Скопіюйте текст і відкрийте чат клієнта вручну.</div>`}`}`;
  return shell('Надіслати підбірку',body,(f.checking?'':B(t('copy'),'copy',f.text)+(f.channel==='WhatsApp'?`<a class="btn" href="${esc(wa)}" target="_blank" rel="noopener">Відкрити WhatsApp</a>`:''))+B('Підтверджую: надіслано ('+ok.length+')','sendConfirm','','','pri',(!f.checking&&ok.length)?'':'disabled'));
}
/* --- Відповідь клієнта в чаті --- */
function mReply(){
  const f=S.form.rp, p=S.props.find(x=>x.id===f.pid), l=Ls(p.lid), c=C(p.cid);
  return shell('Клієнт відповів у чаті',`<div class="small muted">${esc(c.name)} · ${esc(lotName(l))}</div>
   ${S.llm?`${fld('Вставте відповідь клієнта (необов’язково), ШІ запропонує статус','rpt',`<textarea id="rpt" data-f="rp.text" data-live="1" placeholder="Напр.: Другий цікавий, але перший трохи дорого">${esc(f.text)}</textarea>`)}
   ${f.text.trim()?`<div class="row">${B('Визначити відповідь (ШІ)','rpClass','','','sm')}</div>`:''}
   ${f.res?`<div class="note info">${f.res.r?`<b>Підказка ШІ:</b> ${{liked:'Подобається',disliked:'Відхилено'+(f.res.reason?' ('+reasonLabel(f.res.reason)+')':''),wants_viewing:'Хоче показ'}[f.res.r]} <span class="small">(${f.res.why})</span> ${B('Застосувати','rpApply','','','sm pri')}`:'Відповідь не розпізнано. Оберіть вручну.'}</div>`:''}`:''}
   <h3>Зафіксувати відповідь</h3><div class="row">${B('Подобається','rpSet',p.id,'liked','sm')}${B('Хоче показ','rpSet',p.id,'wants_viewing','sm')}${B('Відхилено','rpAsk','','','sm'+(f.ask?' pri':''))}</div>
   ${f.ask?`<div class="field"><span class="lbl">Причина відмови (один клік, і готово)</span><div class="chips">${Object.keys(REASONS.uk).map(k=>`<span class="chip" role="button" tabindex="0" data-a="rpReason" data-id="${k}">${reasonLabel(k)}</span>`).join('')}</div></div>`:''}`,'');
}
/* --- Сторінка клієнта (телефон) --- */
function mPub(){
  const f=S.form.pub, c=C(f.cid), L=PUB[f.lang], ps=propsOf(c.id).filter(p=>p.delivery!=='draft');
  const card=p=>{const l=Ls(p.lid), gone=unavailable(l)&&p.reaction!=='disliked';
    const sl=p.reaction==='wants_viewing'&&!p.slot?(p.offered?`<div class="m small">${L.pick}</div><div class="row">${SLOTS.map(s=>`<button class="btn sm" data-a="pubSlot" data-id="${p.id}" data-v="${s}">${fmtAtL(s,f.lang)}</button>`).join('')}</div>`:`<div class="m small">${L.wait}</div>`):'';
    return `<div class="plot"><div class="row nw" style="justify-content:space-between;align-items:flex-start"><div><b>${esc(lotName(l))}</b><div class="m small">${l.rooms} ${L.rm} · ${String(l.area).replace('.',',')} m² · ${l.floor?l.floor+' '+L.fl:'dom'}</div></div><b class="num">${zl(l.price)}</b></div>
     ${gone?`<div class="pill plain" style="background:#e4e8e7;color:#51605c">${L.un}</div>`:`<div class="row"><button class="btn sm ${p.reaction==='liked'?'on':''}" data-a="pubReact" data-id="${p.id}" data-v="liked">👍 ${L.like}</button><button class="btn sm ${p.reaction==='disliked'?'on':''}" data-a="pubReact" data-id="${p.id}" data-v="disliked">👎 ${L.no}</button><button class="btn sm ${p.reaction==='wants_viewing'?'on':''}" data-a="pubReact" data-id="${p.id}" data-v="wants_viewing">${L.want}</button></div>
     ${p.reaction==='disliked'?`<div class="m small">${L.why}</div><div class="row">${Object.keys(REASONS.uk).map(k=>`<button class="btn sm ${p.reason===k?'on':''}" data-a="pubReason" data-id="${p.id}" data-v="${k}">${REASONS[f.lang][k]}</button>`).join('')}</div>`:''}${sl}

function sparkSvg(l){
  const h=hist(l); if(h.length<2) return `<p class="small muted">Ціна не змінювалась із ${fmtD(h[0][0])}.</p>`;
  const W=300,H=84,pl=8,pr=8,pt=14,pb=16, ts=h.map(x=>new Date(x[0]).getTime()), t0=Math.min(...ts), t1=Math.max(...ts,t0+1), ps=h.map(x=>x[1]), lo=Math.min(...ps), hi=Math.max(...ps), rg=Math.max(hi-lo,1);
  const X=i=>pl+(ts[i]-t0)/(t1-t0)*(W-pl-pr), Y=v=>pt+(1-(v-lo)/rg)*(H-pt-pb);
  const pts=h.map((x,i)=>X(i)+','+Y(x[1])).join(' '), area=`${X(0)},${H-pb} ${pts} ${X(h.length-1)},${H-pb}`, last=h.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Історія ціни"><polygon points="${area}" fill="var(--accent-soft)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>${h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="${i===last?4:2.5}" fill="${i===last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`).join('')}
   <text x="${pl}" y="10" font-size="10" fill="var(--ink2)">${zl(hi)}</text><text x="${W-pr}" y="${H-3}" font-size="10" text-anchor="end" fill="var(--ink2)">${zl(lo)}</text><text x="${pl}" y="${H-3}" font-size="10" fill="var(--ink2)">${fmtD(h[0][0])}</text></svg>`;
}

document.addEventListener('click',e=>{
  if(S.menu&&!e.target.closest('[data-a="menu"]')&&!e.target.closest('.pop')){S.menu=null;render()}
  if(S.gq&&!e.target.closest('.search')){S.gq='';render()}
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a;
  if(a==='ovClose'&&e.target!==el) return;
  if(el.tagName==='A'&&el.getAttribute('href')==='#') e.preventDefault();
  if(el.disabled) return;
  if(A[a]){A[a](el,el.dataset.id,el.dataset.v,e);if(el.closest('.pop')&&a!=='menu')S.menu=null;render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.modal){S.modal=null;S.form={};render()}else if(S.menu||S.gq){S.menu=null;S.gq='';render()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.s){S[el.dataset.s]=el.value;if(el.dataset.s==='gq')S.menu=null;render();return}
  if(el.dataset.f){fset(el.dataset.f,el.type==='checkbox'?el.checked:el.value);if(el.dataset.f==='rg.dev')S.form.rg.days=S.devs[el.value].days;if(el.dataset.live)render()}
});
document.addEventListener('change',e=>{
  const el=e.target,c=el.dataset.c; if(!c) return;
  const cl=el.dataset.id&&C(el.dataset.id), n=el.dataset.n;
  if(c==='role'){S.role=el.value;S.cid=null;S.modal=null;S.sel=null;S.page=PAGES[S.page]&&PAGES[S.page].includes(S.role)?S.page:defaultPage()}
  if(c==='lang')S.lang=el.value;
  if(c==='cr'){const cr=cl.crit,k=el.dataset.k;if(k==='cities'){cr.cities=el.value==='both'?['Wrocław','Poznań']:[el.value];const ok=distsOf(cr.cities);cr.dists=cr.dists.filter(d=>ok.includes(d))}else cr[k]=k==='finish'?el.value:Number(el.value)}
  if(c==='room'){const cr=cl.crit,v=+n;cr.rooms=el.checked?[...new Set([...cr.rooms,v])].sort():cr.rooms.filter(x=>x!==v)}

  if(c==='bv')cl.crit.bv=el.checked;
  if(c==='ldist')S.ldist=el.checked?[...new Set([...S.ldist,n])]:S.ldist.filter(x=>x!==n);
  if(c==='linv')S.linv=el.value;
  if(c==='rule'){S.rules.find(r=>r.k===el.dataset.k).on=el.checked}
  if(c==='vremind')S.views.find(v=>v.id===el.dataset.id).remind=el.checked;
  if(c==='digest'){S.digestOn=el.checked;toast(el.checked?'Дайджест щопонеділка о 09:00':'Тижневий дайджест вимкнено');return}
  if(c==='adaptive')SR(el.dataset.id).adaptive=el.checked;
  if(c==='int'){const k=el.dataset.k;S.ints[k]=el.checked;if(k==='llm')S.llm=el.checked;if(k==='feed')SR('s8').state=el.checked?'ok':'paused';if(k==='cloud'||k==='tgclient'){render();toast(el.checked?'Пілот увімкнено (у прототипі умовно)':'Вимкнено');return}
   const msg={tel:['Телефонія увімкнена: кнопка «Дзвінок» у картках і запитах','Телефонія вимкнена: кнопки «Дзвінок» сховано'],gcal:['Покази синхронізуються з Google Calendar','Синхронізацію вимкнено, лишається файл .ics'],email:['Адреса пересилання показана в профілі клієнта','Пошту в стрічку вимкнено'],meta:['Ліди з Facebook надходять у «Запити»','Ліди з Facebook більше не надходять'],portals:['Листи з Otodom і OLX розбираються в «Запити»','Запити з порталів більше не надходять'],fakt:['Фактури виставляються через Fakturownia','Фактури лише позначаються вручну'],autenti:['Договір надсилається через Autenti','Договір надсилається як PDF на e-mail'],messenger:['Messenger доступний як канал','Messenger прибрано з каналів']}[k];
   if(msg){render();toast(msg[el.checked?0:1]);return}}
  if(c==='ddone'){const d=S.deals.find(x=>x.id===el.dataset.id);d.dates[el.dataset.k].done=el.checked;toast(el.checked?'Дату позначено виконаною':'Позначку знято');return}
